}

/* repaint only the parts that depend on the stat + line, so typing a line keeps focus */
function propPaint(){
  const P=S.props, c=P.ctx, host=$('ppOut'); if(!c||!host) return;
  const line=parseFloat(propLineOf(P.stat)), i=P.stat;
  const lab=(c.num.find(x=>x.i===i)||{l:''}).l;
  const vals=propVals(i);
  const og=c.next&&c.next.opp&&c.def?c.def.teams[c.next.opp.id]:null;
  const G=og?gradeFor(og,lab):null, ogr=G&&G.g;
  const gradeOf=r=>{const q=gradeFor(c.opp(r),lab); return q&&q.g;};
  const act=document.activeElement, actSel=act&&act.tagName==='INPUT'?[act.id,act.dataset.ppml,act.selectionStart]:null;
  const top=$('ppTop');
  if(top) top.innerHTML=(P.top&&P.top.length>1)?`<h4 style="margin:4px 0 6px">Key stats${esc(c.pos?' \u00b7 '+c.pos:'')}</h4><div class="pmini">${P.top.map(col=>propMini(col,col.i===i)).join('')}</div>`:'';
  let out='';
  /* add this stat and line to the slip */
  const dir=P.dir||'over';
  if(c.next&&!isNaN(line)){
    const pr=propProb(vals,line,dir,c.w);
    const odds=P.odds||'';
    const fair=pr?(pr.p>=.5?'-'+Math.round(100*pr.p/(1-pr.p)):'+'+Math.round(100*(1-pr.p)/pr.p)):'\u2014';
    const dd=americanDec(odds);
    const edge=(pr&&dd)?(pr.p-1/dd):null;
    const on=slipHasLeg(P.lg,propLegId(P,lab,dir));
    out+=`<div class="slipadd"><span class="seg"><button type="button" data-ppdir="over" class="${dir==='over'?'on':''}">Over</button><button type="button" data-ppdir="under" class="${dir==='under'?'on':''}">Under</button></span>
      <b>${esc(lab)} ${dir==='over'?'o':'u'}${line}</b>
      <input type="text" inputmode="text" id="ppOdds" data-ppodds placeholder="book odds" value="${esc(odds)}" aria-label="Book odds for this prop">
      <button class="btn${on?' ghost':''}" type="button" data-ppslip="1">${on?'\u2713 On slip':'+ Slip'}</button>
      <span class="muted">model ${pr?(pr.p*100).toFixed(0):'\u2014'}% \u00b7 fair ${fair}${pr?` \u00b7 ${pr.over} of ${pr.n}`:''}${edge!=null?` \u00b7 <b class="${edge>0?'good':'bad'}">${edge>0?'+':''}${(edge*100).toFixed(1)}% edge</b>`:''}</span></div>`;
    if(pr&&pr.n<8) out+=`<p class="sub" style="margin:6px 0 0">Only ${pr.n} games in the log \u2014 that model number leans on the normal curve more than on what he has actually done.</p>`;
  } else if(c.next){
    out+=`<p class="sub" style="margin:10px 0 0">Set a line above to price this stat and add it to the slip.</p>`;
  }

  /* splits */
  const sw=vals.reduce((s,x)=>s+c.w(x.r),0)||1;
  const wavg=vals.reduce((s,x)=>s+c.w(x.r)*x.v,0)/sw;
  const hv=isNaN(line)?null:line;
  const cls=h=>h.pct==null?'':h.pct>=.6?'good':h.pct<=.4?'bad':'';
  const show=h=>h.n?(h.pct==null?h.avg.toFixed(1):pctTxt(h.pct)):'—';
  const sub=h=>h.n?(h.pct==null?`${h.n} games`:`${h.o} of ${h.n} · avg ${h.avg.toFixed(1)}`):'no games';
  const rows=[
    ['Season',vals],
    ['Last 5',vals.slice(0,5)],
    ['Last 10',vals.slice(0,10)],
    ['Home',vals.filter(x=>x.r.atVs!=='@')],
    ['Away',vals.filter(x=>x.r.atVs==='@')],
  ];
  if(c.next&&c.next.opp&&c.next.opp.id) rows.push(['vs '+(c.next.opp.abbr||c.next.opp.name),vals.filter(x=>x.r.opp&&String(x.r.opp.id)===String(c.next.opp.id))]);
  if(c.def){ rows.push(['vs tough D (A–B)',vals.filter(x=>'AB'.includes(gradeOf(x.r)||'-'))],['vs soft D (D–F)',vals.filter(x=>'DF'.includes(gradeOf(x.r)||'-'))]);
    if(ogr) rows.push([`vs grade-${ogr} D`,vals.filter(x=>gradeOf(x.r)===ogr)]); }
  const splits=rows.map(([k,xs])=>{const h=propHit(xs,hv); return propTile(k,show(h),sub(h),cls(h));}).join('');
  out+=`<h4 style="margin:12px 0 6px">Splits${isNaN(line)?' · averages':' · hit rate over '+line}</h4><div class="pgrid">${splits}</div>`;

  /* the read */
  const l5=propHit(vals.slice(0,5),hv), seas=propHit(vals,hv);
  out+=`<div class="pgrid" style="margin-top:8px">${propTile('Opp-weighted avg',wavg.toFixed(1),`straight ${seas.avg?seas.avg.toFixed(1):'—'}`,'',
    'Each game counts more the tougher that opponent’s defense: weight = league average allowed ÷ that opponent’s average allowed.')}
    ${propTile('Last 5 trend',(l5.avg!=null&&seas.avg!=null?((l5.avg-seas.avg>=0?'+':'')+(l5.avg-seas.avg).toFixed(1)):'—'),'vs season average',l5.avg!=null&&seas.avg!=null?(l5.avg>=seas.avg?'good':'bad'):'')}
    ${isNaN(line)?'':propTile('Edge vs line',((wavg-line>=0?'+':'')+(wavg-line).toFixed(1)),'opp-weighted avg − line',wavg>line?'good':'bad')}
    ${G?propTile('Next D rank','#'+G.rank,`of ${G.n} · grade ${ogr} · ${esc(G.src)}`,'AB'.includes(ogr)?'bad':'DF'.includes(ogr)?'good':'',G.detail||''):''}</div>`;
  if(!isNaN(line)) out+=`<p class="sub" style="margin:8px 0 0">${seas.o} over, ${seas.u} under${seas.p?`, ${seas.p} push`:''} at ${line} this season. Opponent-weighted average ${wavg.toFixed(1)} vs a straight ${seas.avg.toFixed(1)} — the weighted number is the one to trust when the schedule has been lopsided.</p>`;

  /* how much the defense grade actually moves this stat for this player */
  const tgh=vals.filter(x=>'AB'.includes(gradeOf(x.r)||'-')), sft=vals.filter(x=>'DF'.includes(gradeOf(x.r)||'-'));
  if(tgh.length>=2&&sft.length>=2){
    const m=xs=>xs.reduce((s,x)=>s+x.v,0)/xs.length;
    const ta=m(tgh), sa=m(sft), gap=sa-ta;
    const all=vals.map(x=>x.v), mu=m(vals);
    const sd=Math.sqrt(all.reduce((s,v)=>s+(v-mu)*(v-mu),0)/all.length);
    const rel=sd>0?Math.abs(gap)/sd:0;
    const verdict=gap<0?`runs backwards at this sample \u2014 he has actually put up more ${lab} against the tougher defenses, which is noise rather than a read`
      :rel<0.25?`barely moves ${lab} for him \u2014 at this sample the grade is close to noise for this stat`
      :rel<0.6?`nudges ${lab} but doesn\u2019t decide it`
      :`moves ${lab} enough to matter`;
    out+=`<p class="sub" style="margin:8px 0 0"><b>Defense sensitivity:</b> ${esc(lab)} averages <b>${sa.toFixed(1)}</b> against soft defenses (D\u2013F, ${sft.length} game${sft.length===1?'':'s'}) and <b>${ta.toFixed(1)}</b> against tough ones (A\u2013B, ${tgh.length}) \u2014 a ${Math.abs(gap).toFixed(1)} gap against a game-to-game swing of \u00b1${sd.toFixed(1)}. The grade ${verdict}.</p>`;
  } else if(c.def){
    out+=`<p class="sub" style="margin:8px 0 0"><b>Defense sensitivity:</b> not enough games yet against both tough and soft defenses to say whether the grade moves ${esc(lab)} for him.</p>`;
  }

  /* game log with defense grades */
  out+=`<h4 style="margin:14px 0 6px">Game log · opponent defense grade</h4><div class="tbl" style="max-height:360px;overflow:auto"><table class="btable"><thead><tr><th>Game</th><th>Opp D</th>${c.labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>{
    const t=c.opp(r), q=gradeFor(t,lab), g=q&&q.g, dt=r.date?new Date(r.date).toLocaleDateString([], {month:'numeric',day:'numeric'}):'';
    const v=i==null?null:parseFloat(String(r.stats[i]==null?'':r.stats[i]).replace(/,/g,''));
    const mark=isNaN(line)||isNaN(v)?'':(v>line?'good':v<line?'bad':'');
    return `<tr><td>${esc([dt,[r.atVs,r.opp&&r.opp.abbreviation].filter(Boolean).join(' '),[r.res,r.score].filter(Boolean).join(' ')].filter(Boolean).join(' · '))}</td><td${q?` title="#${q.rank} of ${q.n} by ${esc(q.src)}${q.detail?' · '+esc(q.detail):''}"`:''}>${q?`<b class="${'AB'.includes(g)?'good':'DF'.includes(g)?'bad':''}">${g}</b> <span class="muted">#${q.rank}</span>`:'—'}</td>${c.labels.map((l,k)=>`<td${k===i&&mark?` class="${mark}"`:''}>${esc(r.stats[k]==null?'':r.stats[k])}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div>
    <p class="sub" style="margin:6px 0 0">Grade source: ${G&&G.stat?esc(G.src)+' \u2014 the defense\u2019s rank in this exact category, not its overall rank':esc(c.def&&c.def.mN?`your model\u2019s opponent-adjusted defensive rating for ${c.def.mN} of ${c.def.n} teams, ESPN standings for the rest`:(c.def&&c.def.paceOn?'ESPN standings, points allowed per game divided by each team\u2019s own pace':'ESPN standings, points allowed per game'))}. A = toughest 20%, F = easiest 20%.${G&&G.stat?'':' It rates a defense overall, not against this one stat.'} The sensitivity line above says how much that grade has actually moved this number for him.</p>`;
  host.innerHTML=out;
  const putCaret=(el,at)=>{ if(!el) return; el.focus();
    const n=(at==null||isNaN(at))?el.value.length:at;
    try{ el.setSelectionRange(n,n); }catch(e){} };
  if(actSel&&actSel[1]!=null) putCaret(document.querySelector(`[data-ppml="${actSel[1]}"]`),actSel[2]);
  else if(actSel&&actSel[0]==='ppOdds') putCaret($('ppOdds'),actSel[2]);
  if(vals.length) propChart({labels:c.labels,rows:c.rows,def:c.def,opp:c.opp,w:c.w},i,vals,line,wavg,lab,'ppChart');
}
document.addEventListener('input',e=>{ const t=e.target; if(!t) return;
  if(t.id==='ppLine'){ S.props.lines[S.props.stat]=t.value; propPaint(); }
  else if(t.id==='ppStat'){ S.props.stat=+t.value; S.props.odds=''; renderProps(); }
  else if(t.dataset&&t.dataset.ppml!=null){ S.props.lines[+t.dataset.ppml]=t.value; propPaint(); }
  else if(t.id==='ppOdds'){ S.props.odds=t.value; propPaint(); }
  else if(t.dataset&&t.dataset.legodds!=null){ const l=S.slip.legs[+t.dataset.legodds];
    if(l){ l.odds=t.value; S.slipFocus=+t.dataset.legodds; S.slipFocusAt=t.selectionStart;
      slipSave(); renderSlip(); S.slipFocus=null; S.slipFocusAt=null; } } });
document.addEventListener('keydown',e=>{ if(e.target&&e.target.id==='ppq'&&e.key==='Enter'){ const v=e.target.value.trim(); if(v.length>=2){ e.preventDefault(); propFind(v); e.target.blur(); } } });

async function loadStars(){
  const MP=window.MODEL_PICKS||{}; const today=new Date(); today.setHours(0,0,0,0);
  const lim=new Date(today); lim.setDate(lim.getDate()+3);
  const list=[];
  for(const lg of Object.keys(LEAGUES)){ const P=MP[lg]; if(!P||!P.games) continue;
    for(const p of P.games){ if(!p.best||!p.date) continue; const d=new Date(p.date+'T12:00:00'); if(d<today||d>lim) continue; list.push({lg,p}); } }
  if(S.stFlight) return;
  const first=!S.stEv||!S.stars; S.stars=list; if(!S.stEv) S.stEv={}; renderStars();
  const tasks=[...new Set(list.map(x=>x.lg+'|'+x.p.date.replace(/-/g,'')))]; if(!tasks.length){ S.stLast=Date.now(); return; }
  S.stBusy=first; S.stFlight=true; if(first) renderStars(); const tok=S.token;
  await Promise.all(tasks.map(async t=>{ const [lg,d]=t.split('|'); const L=LEAGUES[lg]; const q=new URLSearchParams(L.params||{}); q.set('dates',d);
    try{ const data=await getJSON(API+L.path+'/scoreboard?'+q,15000); for(const ev of (data.events||[]).map(norm)) S.stEv[lg+'|'+ev.id]=ev; }catch(e){} }));
  S.stBusy=false; S.stFlight=false; S.stLast=Date.now(); if(tok===S.token&&S.league==='stars') renderStars();
  // Keep ★ Today live: every 30s while a ★ game is live or about to start, else every 2 min
  clearTimeout(S.stTimer);
  if(S.league==='stars'){ const soon=Date.now()+10*60000;
    const hot=Object.values(S.stEv).some(e=>e&&(e.state==='in'||(e.state==='pre'&&e.date<soon))&&(S.stars||[]).some(({p})=>p.id?p.id===e.id:(teamIs(p.away,e.away)&&teamIs(p.home,e.home))));
    S.stTimer=setTimeout(()=>{ if(S.league==='stars') loadStars(); }, hot?30000:120000); }
}
function renderStars(){
  const el=$('hist'); const list=S.stars||[];
  const rows=list.map(({lg,p})=>{
    const ev=Object.values(S.stEv||{}).find(e=>e&&(p.id?e.id===p.id:(teamIs(p.away,e.away)&&teamIs(p.home,e.home))));
    const when=ev?ev.date:new Date(p.date+'T12:00:00'); return {lg,p,ev,when};
  }).sort((a,b)=>a.when-b.when);

  // Top-of-page summary: count, live, SU/ATS records on finished ★ picks
  let liveCount=0, bestFinished=0, bestWon=0, atsDone=0, atsWon=0;
  for(const {p,ev} of rows){
    if(!ev) continue;
    if(ev.state==='in') liveCount++;
    else if(ev.state==='post'){
      const r=grade(ev,p);
      if(r.su==='win'||r.su==='loss'){bestFinished++; if(r.su==='win') bestWon++;}
      if(r.ats==='win'||r.ats==='loss'){atsDone++; if(r.ats==='win') atsWon++;}
    }
  }
  const tiles=`<div class="summary stars-sum">
    <div class="tile"><div class="k">★ Best picks</div><div class="v">${rows.length}</div><div class="s">next 3 days</div></div>
    <div class="tile"><div class="k">Live now</div><div class="v">${liveCount||'—'}</div><div class="s">${liveCount?'tap a card for detail':'nothing live'}</div></div>
    <div class="tile"><div class="k">Finished · SU</div><div class="v">${bestFinished?bestWon+'–'+(bestFinished-bestWon):'—'}</div><div class="s">★ picks graded</div></div>
    <div class="tile"><div class="k">Finished · ATS</div><div class="v">${atsDone?atsWon+'–'+(atsDone-atsWon):'—'}</div><div class="s">against the spread</div></div>
  </div>`;

  // Group by calendar day
  const dayKey=(d)=>ymd(d);
  const todayKey=ymd(new Date()); const tomKey=ymd(new Date(Date.now()+864e5));
  const byDay=new Map();
  for(const r of rows){ const k=dayKey(r.when); if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(r); }
  const dayLabel=(k)=>{ if(k===todayKey) return 'Today'; if(k===tomKey) return 'Tomorrow'; const d=parseYmd(k); return d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'}); };

  // Reuse the full game card() renderer league tabs use, by briefly swapping S.league per card
  const savedLg=S.league; let body='';
  const sortedKeys=[...byDay.keys()].sort();
  for(const k of sortedKeys){
    const items=byDay.get(k);
    const liveHere=items.filter(x=>x.ev&&x.ev.state==='in').length;
    body+=`<div class="day-head"><span class="day-name">${dayLabel(k)}</span><span class="day-meta">${items.length} ★${liveHere?` · ${liveHere} live`:''}</span></div><div class="games stars-games">`;
    for(const {lg,p,ev} of items){
      if(ev){ S.league=lg; body+=card(ev); }
      else{
        // Pick exists but ESPN event isn't posted yet — simple placeholder in the same card frame
        const kick=new Date(p.date+'T12:00:00').toLocaleDateString([], {weekday:'short',month:'numeric',day:'numeric'});
        body+=`<article class="game s-pre star-stub">
          <div class="g-top"><span class="status">${esc(kick)}</span><span class="g-tr"><span class="m-tag">${HLG[lg]||lg.toUpperCase()}</span></span></div>
          <div class="teams">
            <div class="trow"><span class="logo-ph"></span><div class="tname"><b>${esc(p.away)}</b></div><div class="score"></div></div>
            <div class="trow"><span class="logo-ph"></span><div class="tname"><b>${esc(p.home)}</b></div><div class="score"></div></div>
          </div>
          <div class="model">
            <div class="chips">
              <span class="chip pick">★ ${esc(p.pick)} <b>${p.win}%</b></span>
              ${p.vegas!=null?`<span class="chip">Vegas ${p.vegas}%</span>`:''}
              ${p.line?`<span class="chip">Line ${esc(p.line)}</span>`:''}
              ${p.spreadPick?`<span class="chip">ATS ${esc(p.spreadPick)}</span>`:''}
            </div>
            ${p.why?`<p class="why">${esc(p.why)}</p>`:''}
          </div>
          <div class="meta"><span class="muted">Scoreboard + odds load once ESPN posts the game</span></div>
        </article>`;
      }
    }
    body+=`</div>`;
  }
  S.league=savedLg;

  const intro=`<div class="stars-intro"><div class="sub">Every ★ Best Pick from today through the next 3 days, across all your sports, grouped by day and ordered by tip. Tap any card for the same detail you see on the league tabs.</div>${S.stBusy?'<div class="sub muted">Loading live scores…</div>':''}</div>`;
  el.innerHTML=recapHTML()+tiles+intro+(rows.length?body:'<div class="empty">No ★ Best Picks in the next 3 days yet. They appear as soon as a model run publishes them.</div>');
}

loadData().then(()=>{ render(); openView(); });
render();
})();
</script>
