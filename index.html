<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Game Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky control bar (league tabs, date/week nav, filters) over a slate summary strip and a wrapping grid of game cards; tap a card to expand detail in place. */
:root{
  --bg:#e9edf1; --panel:#ffffff; --panel2:#f4f6f8; --ink:#16212b; --muted:#5d6c79; --line:#d3dbe2;
  --accent:#b36b00; --accent-soft:#fff1d6;
  --good:#2b8a3e; --good-soft:#e3f4e6; --bad:#c62828; --bad-soft:#fbe5e5; --warn:#b35c00; --live:#d6262f;
  --home:#2f5d9e; --away:#8a5a2b;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --panel:#17202a; --panel2:#1d2833; --ink:#e7edf2; --muted:#93a3b1; --line:#2a3744;
    --accent:#f2a93b; --accent-soft:#3a2a10;
    --good:#5cc97a; --good-soft:#143022; --bad:#ff6b6b; --bad-soft:#3a1818; --warn:#f0a050; --live:#ff4d55;
    --home:#7fa8e6; --away:#d6a673; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#17202a; --panel2:#1d2833; --ink:#e7edf2; --muted:#93a3b1; --line:#2a3744;
  --accent:#f2a93b; --accent-soft:#3a2a10;
  --good:#5cc97a; --good-soft:#143022; --bad:#ff6b6b; --bad-soft:#3a1818; --warn:#f0a050; --live:#ff4d55;
  --home:#7fa8e6; --away:#d6a673; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--home)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* control bar */
.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:6px;padding-block:8px}
.top{background:var(--panel)}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px 2px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font:700 19px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.ttl{display:flex;flex-direction:column;gap:3px;min-width:0}
.updt{font:500 11px/1.1 var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:700px){ .ttl{flex-direction:row;align-items:baseline;gap:12px} }
.upd{min-width:0}
/* one-line strips that swipe sideways instead of stacking */
.tabs,.filters{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:16px}
.tabs::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.tab,.fchip{flex:none;white-space:nowrap}
.row2{flex-wrap:nowrap!important;min-width:0}
.row2 .filters{flex:1;min-width:0;margin-inline:0 calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:0 16px}
.row2 .nav{flex:none}
@media (max-width:560px){ .nav .lbl{min-width:0!important;font-size:15px!important;padding-inline:2px} .nav button{width:30px!important} #today{display:none} }
.brand h1 span{color:var(--accent)}
.upd{font:500 12px/1.2 var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.upd button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 10px;font:600 12px var(--f-body)}
.tabs,.filters{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 12px;font:700 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:6px}
.nav button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;width:34px;height:30px;font-weight:700}
.nav .lbl{font:700 17px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;min-width:120px;text-align:center}
.fchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding-block:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .v{font:700 26px/1.1 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
@media (max-width:560px){ .summary{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;padding-block:10px!important} .tile{padding:7px 8px} .tile .k{font-size:9.5px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tile .v{font-size:20px} .tile .s{font-size:10.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} }
.note{font-size:13px;color:var(--muted);padding-bottom:10px;display:flex;gap:6px 14px;flex-wrap:wrap}
.err{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-weight:600}

/* cards */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;padding-bottom:40px;align-items:start}
.game{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.game.s-in{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.status{font:700 13px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.s-in .status{color:var(--live)}
.s-in .status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.s-in .status::before{animation:none}}
.teams{padding:8px 12px 4px}
.trow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:4px 0}
.trow img{width:28px;height:28px;object-fit:contain}
.tname{min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tname b{font:700 19px/1.1 var(--f-display);letter-spacing:.01em}
.tname .rk{font:600 12px var(--f-mono);color:var(--muted)}
.tname .rec{font-size:12px;color:var(--muted)}
.tname .pk{font:700 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:3px 5px}
.score{font:700 26px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.trow.lose .score,.trow.lose b{color:var(--muted)}
.sit{margin:2px 12px 6px;font-size:13px;color:var(--ink);background:var(--panel2);border-radius:6px;padding:6px 8px}
.sit b{color:var(--live)}
.wp{margin:6px 12px;display:grid;gap:3px}
.wp .lab{display:flex;justify-content:space-between;font:600 11px var(--f-mono);color:var(--muted)}
.wp .track{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.wp .a{background:var(--away)} .wp .h{background:var(--home)}
.model{margin:8px 12px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:6px}
.m-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.m-tag{font:700 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.star{color:var(--accent);font-weight:700}
.dis{color:var(--warn);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--panel2)}
.chip b{margin-left:4px}
.chip.win{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.loss{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip.push{border-color:var(--muted)}
.meta{padding:6px 12px 10px;display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.meta .wx-flag{color:var(--warn);font-weight:700}
.meta .inj{color:var(--bad)}
.more{width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:8px;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.more:hover{background:var(--panel2);color:var(--ink)}
.detail{border-top:1px solid var(--line);padding:10px 12px 14px;display:grid;gap:14px;background:var(--panel2)}
.detail h4{margin:0 0 6px;font:700 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.detail p{margin:0;font-size:13.5px}
.why{max-width:65ch}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--muted);font-weight:500}
.tbl thead th{font:700 12px var(--f-display);letter-spacing:.06em;color:var(--ink)}
.injcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.injcols ul{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:3px}
.injcols li span{color:var(--muted)}
.st-out{color:var(--bad);font-weight:600}
.st-q{color:var(--warn);font-weight:600}
.spark{width:100%;height:56px;display:block}
.spark .mid{stroke:var(--line);stroke-dasharray:3 3}
.spark .ln{fill:none;stroke:var(--home);stroke-width:2}
.spark .ar{fill:var(--home);opacity:.12}
.muted{color:var(--muted)}
.empty{grid-column:1/-1;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.leaders{display:grid;gap:4px;font-size:13px}
.leaders div span{color:var(--muted)}
.sk{color:var(--muted);font-size:13px}
.search{position:relative;display:flex}
.search input{width:100%;font:500 15px var(--f-body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 36px 9px 12px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:15px;width:30px;height:30px}
.sres{padding-top:14px;display:grid;gap:10px}
.sres .panel{display:grid;gap:8px}
.sres,.sres .panel{grid-template-columns:minmax(0,1fr)}
.sres .panel>*{min-width:0}
.plist{display:grid;gap:6px}
.pbtn{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px}
.pbtn img,.pbtn .ph{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--line)}
.pbtn b{display:block;font:700 17px/1.1 var(--f-display)}
.pbtn span{font-size:12.5px;color:var(--muted)}
.pbtn em{font:700 10px var(--f-body);font-style:normal;letter-spacing:.08em;color:var(--muted)}
.phead{display:flex;gap:12px;align-items:center}
.phead img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line)}
.phead h3{margin:0}
.linkbtn{border:0;background:none;padding:0;color:var(--home);font:inherit;text-decoration:underline;cursor:pointer}
.plink{border:0;background:none;padding:0;color:var(--ink);font:600 13px var(--f-body);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.sl{font-size:12.5px;color:var(--muted)} .sl b{color:var(--ink);font-weight:600}
.injcols li{line-height:1.35}
.tab.hist-tab{border-color:var(--accent)}
.g-tr{display:flex;align-items:center;gap:8px;min-width:0}
.g-top .status{white-space:nowrap;flex:none}
.g-top .g-tr>span:first-child:not(.mv-lg){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* ---- fun: your picks, sweat, alerts, recap, slip ---- */
.pickdot{border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;width:30px;height:30px;font:700 15px/1 var(--f-body);display:grid;place-items:center;padding:0}
.pickdot.on{border-style:solid;border-color:var(--home);background:var(--home);color:var(--panel)}
.trow.mine .tname b{text-decoration:underline;text-decoration-color:var(--home);text-underline-offset:3px}
.mypk{font:700 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--home);color:var(--panel);border-radius:999px;padding:3px 7px;margin-left:6px;white-space:nowrap}
.mypk.W{background:var(--good)}.mypk.L{background:var(--bad)}
.chip.mline{background:var(--panel2);border-style:dashed}
.chip.mline.ml-big{border-color:var(--accent);background:var(--accent-soft)}
.mldelta{color:var(--muted);font-weight:500;margin-left:6px;white-space:nowrap}
.chip.mline.ml-big .mldelta{color:var(--accent)}
.sweat{font:700 11px/1 var(--f-body);border-radius:999px;padding:4px 9px;white-space:nowrap;border:1px solid}
.sw-ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sw-warn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sw-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
#alerts{display:flex;flex-direction:column;gap:6px;padding-top:12px}
.alert{border-radius:10px;padding:9px 12px;font:600 13px/1.35 var(--f-body);border:1px solid;cursor:pointer;text-align:left;width:100%;background:var(--panel)}
.al-bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.al-up{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.recap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.rc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 14px/1.2 var(--f-body)}
.rc-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.rc-big{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.rc-list{list-style:none;margin:8px 0 0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.rc-k{font:700 10px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.rc-lgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font:600 11px var(--f-mono);color:var(--muted)}
.streaks{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.stk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.stk .k{font:600 10px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stk .v{font:700 19px/1.1 var(--f-display);margin-top:3px}
.stk .v{color:var(--ink)}
.stk.hot{border-color:var(--good);background:var(--good-soft)} .stk.hot .v{color:var(--good)}
.stk.cold{border-color:var(--bad);background:var(--bad-soft)} .stk.cold .v{color:var(--bad)}
.heat{font-size:11px;margin-left:3px}
.g-acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.slipbtn{font:600 11.5px/1 var(--f-body);padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
.slipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.slipbtn.mdl{border-style:dashed} .slipbtn .so{opacity:.75;font-weight:600}
.slip-wrap{padding-top:14px;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.slip-bank{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.slip-bank .b{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.leg{display:grid;gap:4px;border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.leg .lrow{display:flex;align-items:center;gap:8px}
.leg .lrow .lo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.leg:first-child{border-top:0}
.leg .lp{font-weight:700}
.leg .lo{font:600 13px var(--f-mono);white-space:nowrap}
.slip-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.slip-sum div{background:var(--panel2);border-radius:8px;padding:8px 10px}
.slip-sum .k{font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slip-sum .v{font:700 18px/1.1 var(--f-display);margin-top:3px;font-variant-numeric:tabular-nums}
.slip-go{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.slip-go input{width:92px;font:600 15px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:8px;padding:9px 16px;font:700 14px var(--f-body)}
.btn.ghost{background:transparent;color:var(--ink)}
.bet{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.bet.won{border-color:var(--good);background:var(--good-soft)}
.bet.lost{border-color:var(--line);opacity:.75}
.bet .bt{display:flex;justify-content:space-between;gap:8px;font:700 13px var(--f-body);flex-wrap:wrap}
.bet ul{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.lw{color:var(--good);font-weight:700}.ll{color:var(--bad);font-weight:700}
@media (max-width:560px){ .g-acts{padding:0 10px 10px} }

.mvbtn{font:600 11.5px/1 var(--f-body);padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;white-space:nowrap}
.mvbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.mvn{display:inline-block;min-width:1.4em;padding:1px 5px;border-radius:999px;background:var(--accent);color:var(--panel);font-size:11px;line-height:1.3;text-align:center}
.tab[aria-selected="true"] .mvn{background:var(--panel);color:var(--accent)}
.mv-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:14px}
.mv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;padding:12px 0 40px;align-items:start}
.mv-tile .mvline{padding:6px 12px 10px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mv-lg{font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.mvx{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:2px 4px}
.mvs{display:grid;gap:4px;margin-top:4px}

/* ---------- normalize ESPN ---------- */
function team(x){ if(!x) return {}; const t=x.team||{};
  return {id:t.id,abbr:t.abbreviation,name:t.name,loc:t.location,short:t.shortDisplayName,full:t.displayName,logo:t.logo||(t.logos&&t.logos[0]&&t.logos[0].href),score:x.score,record:x.records&&x.records[0]&&x.records[0].summary,rank:x.curatedRank&&x.curatedRank.current,winner:x.winner}; }

  const home=cs.find(x=>x.homeAway==='home')||cs[0], away=cs.find(x=>x.homeAway==='away')||cs[1];

  return {id:String(ev.id),date:new Date(ev.date),state:st.state,detail:st.shortDetail||st.detail||'',home:team(home),away:team(away),

}

/* ---------- model picks ---------- */
const nrm=s=>String(s||'').toLowerCase().replace(/\*/g,'').replace(/\((fl|oh)\)/g,'').replace(/[^a-z0-9]/g,'');
const teamIs=(n,t)=>{const k=nrm(n); return !!k&&!!t&&[t.abbr,t.name,t.loc,t.short,t.full].some(v=>nrm(v)===k)};

  const P=picksBlock(lg); if(!P||!P.games) return null;
  for(const p of P.games){
    if(p.id){ if(p.id===g.id) return p; continue; }
    if(teamIs(p.away,g.away)&&teamIs(p.home,g.home)){

function mlMarket(odds,type){

}

  o.top=[];

        if(te){ players.push({id:val(te,'athlete','id'),name:nm(te),pos:posOf(te)||'TE',role:'TE',line:pickStats(L,te.stats,want.receiving)}); used.add(nm(te)); }

function parseGameLog(d){

function avgStats(labels,rows,wfn){
  return labels.map((l,i)=>{ let sw=0,s1=0,s2=0,frac=false,ok=0;

      if(m){frac=true;a=+m[1];s2+=w*(+m[2]);} else { a=parseFloat(v); if(isNaN(a)) continue; }
      sw+=w; s1+=w*a; ok++; }
    if(!ok||!sw) return '—';
    if(frac) return (s1/sw).toFixed(1)+'-'+(s2/sw).toFixed(1);
    const x=s1/sw; return Math.abs(x)>=100?x.toFixed(0):x.toFixed(1);

}

/* ---------- line movement since the pick ---------- */
function homeSpreadFrom(txt,g){
  txt=String(txt||'').trim(); if(!txt) return null; if(/^(even|pk|pick)/i.test(txt)) return 0;
  const m=/^(.*\S)\s+([+-]?\d+(?:\.\d+)?)$/.exec(txt); if(!m) return null;
  const s=sideOf(m[1],g); if(!s) return null; const n=parseFloat(m[2]); return s==='home'?n:-n;
}
function lineMove(g,p){
  const o=g.odds||{}; const out={};
  const then=homeSpreadFrom(p.line,g), now=homeSpreadFrom(o.details,g);
  let side=null; if(p.spreadPick){ const m=/^(.*\S)\s+[+-]?\d/.exec(p.spreadPick); side=m?sideOf(m[1],g):null; } if(!side) side=sideOf(p.pick,g);
  if(then!=null&&now!=null&&side){ const d=now-then; out.spread={then,now,toward:side==='home'?-d:d}; }
  const tot=parseFloat(o.overUnder); if(p.total&&!isNaN(tot)&&p.lean){ const d=tot-p.total; out.total={then:p.total,now:tot,toward:/over/i.test(p.lean)?d:-d}; }
  return out;
}
function moveHTML(g,p){
  if(g.state==='post') return '';
  const m=lineMove(g,p); const bits=[];
  const fmt=x=>(x>0?'+':'')+x;
  if(m.spread&&Math.abs(m.spread.toward)>=1.5){ const good=m.spread.toward>0; bits.push(`<span class="mv ${good?'good':'bad'}">Spread moved ${Math.abs(m.spread.toward)} pts ${good?'toward':'against'} the model (home ${fmt(m.spread.then)} → ${fmt(m.spread.now)})</span>`); }
  if(m.total&&Math.abs(m.total.toward)>=2){ const good=m.total.toward>0; bits.push(`<span class="mv ${good?'good':'bad'}">Total moved ${Math.abs(m.total.toward)} ${good?'toward':'against'} the ${esc(p.lean)} (${m.total.then} → ${m.total.now})</span>`); }
  return bits.length?`<div class="mvs">${bits.join('')}</div>`:'';
}

/* ---------- prop check ---------- */
function propCalc(){
  const c=S.pctx; const out=$('propOut'); if(!c||!out) return;
  const i=+$('propStat').value, line=parseFloat($('propLine').value);
  const vals=c.rows.map(r=>({r,v:parseFloat(String(r.stats[i]==null?'':r.stats[i]).replace(/,/g,''))})).filter(x=>!isNaN(x.v));
  if(!vals.length){ out.innerHTML='<p class="muted" style="margin:0">No games with this stat.</p>'; return; }
  const sw=vals.reduce((s,x)=>s+c.w(x.r),0); const wavg=vals.reduce((s,x)=>s+c.w(x.r)*x.v,0)/sw;
  const avg=vals.reduce((s,x)=>s+x.v,0)/vals.length;
  propChart(c,i,vals,line,wavg);
  const box=(k,v,s,cls)=>`<div class="tile"><div class="k">${k}</div><div class="v ${cls||''}" style="font-size:22px">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  let html=box('Opp-weighted avg',wavg.toFixed(1),`straight ${avg.toFixed(1)}`);
  if(isNaN(line)){ out.innerHTML=html+'<p class="muted" style="margin:0;align-self:center">Enter a line to see hit rates.</p>'; return; }
  const hit=xs=>{const n=xs.length, o=xs.filter(x=>x.v>line).length; return {n,o,pct:n?o/n:null};};
  const all=hit(vals), last5=hit(vals.slice(0,5));
  const g=x=>{const t=c.opp(x.r); return t&&c.def?dGrade(t.rank,c.def.n):null;};
  const tough=hit(vals.filter(x=>'AB'.includes(g(x)||'-'))), soft=hit(vals.filter(x=>'DF'.includes(g(x)||'-')));
  const fmt=h=>h.n?`${h.o} of ${h.n}`:'no games';
  const cls=h=>h.pct==null?'':h.pct>=0.6?'good':h.pct<=0.4?'bad':'';
  html+=box('Over '+line,pctTxt(all.pct),fmt(all),cls(all))+box('Last 5',pctTxt(last5.pct),fmt(last5),cls(last5))+box('vs tough D (A–B)',pctTxt(tough.pct),fmt(tough),cls(tough))+box('vs soft D (D–F)',pctTxt(soft.pct),fmt(soft),cls(soft));
  html+=`<div class="tile"><div class="k">Edge vs line</div><div class="v ${wavg>line?'good':'bad'}" style="font-size:22px">${(wavg-line>=0?'+':'')+(wavg-line).toFixed(1)}</div><div class="s">weighted avg − line</div></div>`;
  out.innerHTML=html;
}
function propChart(c,i,vals,line,wavg,labOverride,elId){
  const el=$(elId||'propChart'); if(!el) return;
  const games=[...vals].reverse(); /* oldest → newest, left to right */
  const hasLine=!isNaN(line);
  const max=Math.max(...games.map(x=>x.v),hasLine?line:0,1)*1.12;
  const lab=labOverride!=null?labOverride:($('propStat')&&$('propStat').selectedOptions[0]?$('propStat').selectedOptions[0].textContent:'');
  const over=hasLine?vals.filter(x=>x.v>line).length:null;
  const last5=vals.slice(0,5); const l5avg=last5.reduce((s,x)=>s+x.v,0)/last5.length;
  const fmtV=v=>Number.isInteger(v)?v:v.toFixed(1);
  const bars=games.map(x=>{const cls=!hasLine?'':x.v>line?'over':x.v<line?'under':'push'; const hpct=Math.max(2,x.v/max*100);
    return `<div class="pc-col"><div class="pc-bar ${cls}" style="height:${hpct}%" title="${esc(lab)} ${fmtV(x.v)}"></div></div>`;}).join('');
  const labels=games.map(x=>{const r=x.r; const t=c.opp(r); const gr=t&&c.def?dGrade(t.rank,c.def.n):'';
    const opp=(r.atVs==='@'?'@':'')+(r.opp&&r.opp.abbreviation||'');
    const dt=r.date?new Date(r.date).toLocaleDateString([], {month:'numeric',day:'numeric'}):'';
    return `<div class="pc-lab"><b>${fmtV(x.v)}</b><span>${esc(opp)}</span><span class="muted">${esc(dt)}</span>${gr?`<span class="pc-gr ${'AB'.includes(gr)?'good':'DF'.includes(gr)?'bad':''}">${gr} D</span>`:''}</div>`;}).join('');
  el.innerHTML=`<div class="pchart">
    <div class="pc-head"><div><span class="pc-big">${hasLine?fmtV(line):'—'}</span> <span class="pc-stat">${esc(lab)}</span></div><div class="pc-over">${hasLine?`${over} of ${vals.length} over`:'Enter a line'}</div></div>
    <div class="pc-scroll"><div class="pc-inner"><div class="pc-plot">${hasLine?`<div class="pc-line" style="bottom:${line/max*100}%"><span>${fmtV(line)}</span></div>`:''}${bars}</div><div class="pc-labels">${labels}</div></div></div>
    <div class="pc-foot"><b>${l5avg.toFixed(1)}</b> avg last ${last5.length} · <b>${wavg.toFixed(1)}</b> opp-weighted · ${vals.length} games</div></div>`;
  const sc=el.querySelector('.pc-scroll'); if(sc) sc.scrollLeft=sc.scrollWidth;
}

function mySave(){ S._myCache=null; store.set('mypicks',JSON.stringify(S.my)); }
const myKey=(lg,id)=>lg+'|'+id;
function myGet(lg,id){ return S.my[myKey(lg,id)]||null; }
function myToggle(lg,g,side){
  const k=myKey(lg,g.id), cur=S.my[k];
  if(cur&&cur.res) return;
  if(cur&&cur.side===side) delete S.my[k];
  else S.my[k]={lg,side,d:ymd(g.date),away:g.away.abbr||g.away.short||'',home:g.home.abbr||g.home.short||'',team:((side==='home'?g.home:g.away).abbr)||''};
  mySave();
}
/* grade a saved pick the moment we see a final, and keep the result */
function myCheck(lg,g){
  const m=myGet(lg,g.id); if(!m) return null;
  if(!m.res&&g.state==='post'){
    const hs=parseFloat(g.home.score), as=parseFloat(g.away.score);
    if(!isNaN(hs)&&!isNaN(as)){
      const mine=m.side==='home'?hs:as, opp=m.side==='home'?as:hs;
      m.res=mine>opp?'W':mine<opp?'L':'P';
      m.final=(g.away.abbr||'')+' '+as+'-'+(g.home.abbr||'')+' '+hs;
      const p=findPick(g,lg);
      if(p){ const sd=sideOf(p.pick,g), r=grade(g,p);
        m.mres=r.su==='win'?'W':r.su==='loss'?'L':'P'; m.agree=sd?(sd===m.side):null; m.mpick=p.pick; }
      mySave();
    }
  }
  return m;
}
function myStats(){
  if(S._myCache) return S._myCache;
  const vals=Object.values(S.my);
  const all=vals.filter(m=>m.res==='W'||m.res==='L');
  const cnt=rs=>({w:rs.filter(r=>r.res==='W').length,l:rs.filter(r=>r.res==='L').length,n:rs.length});
  const mod=rs=>{const x=rs.filter(r=>r.mres==='W'||r.mres==='L'); return {w:x.filter(r=>r.mres==='W').length,l:x.filter(r=>r.mres==='L').length,n:x.length};};
  const fade=all.filter(m=>m.agree===false);
  S._myCache={n:all.length,pending:vals.filter(m=>!m.res).length,you:cnt(all),model:mod(all),
    agree:cnt(all.filter(m=>m.agree===true)),fade:cnt(fade),fadeModel:mod(fade)};
  return S._myCache;
}

/* ---- 2. streaks and heat check ---- */
function heatRows(){
  if(S._heatRows) return S._heatRows;
  let rows=[];
  try{ rows=((S.hRows&&S.hRows.length)?S.hRows:baseHistory()).filter(r=>r.res==='W'||r.res==='L'); }catch(e){ rows=[]; }
  S._heatRows=rows; return rows;
}
function streakOf(rows){
  const s=[...rows].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let run=0,sign=0,best=0,worst=0;
  for(const r of s){ const w=r.res==='W'?1:-1; if(w===sign) run++; else {sign=w;run=1;}
    if(sign>0) best=Math.max(best,run); else worst=Math.max(worst,run); }
  return {run,sign,best,worst,n:s.length};
}
function leagueHeat(lg){
  const rows=heatRows().filter(r=>r.lg===lg); if(rows.length<15) return null;
  const cut=ymd(new Date(Date.now()-14*864e5));
  const recent=rows.filter(r=>r.date>=cut); if(recent.length<8) return null;
  const season=rows.filter(r=>r.res==='W').length/rows.length;
  const w=recent.filter(r=>r.res==='W').length, pct=w/recent.length, d=pct-season;
  return {n:recent.length,w,l:recent.length-w,pct,season,d,hot:d>=.07,cold:d<=-.09};
}
function heatIcon(lg){
  const h=leagueHeat(lg); if(!h||(!h.hot&&!h.cold)) return '';
  return `<span class="heat" title="Last 14 days: ${h.w}-${h.l} (${Math.round(h.pct*100)}%) vs ${Math.round(h.season*100)}% for the season">${h.hot?'\u{1F525}':'\u{1F9CA}'}</span>`;
}
function streakHTML(rows){
  if(!rows||!rows.length) return '';
  const a=streakOf(rows), b=streakOf(rows.filter(r=>r.best));
  const word=s=>s.sign>0?'win':'loss';
  const box=(k,v,cls,sub)=>`<div class="stk ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div>${sub?`<div class="k" style="margin-top:3px;text-transform:none;letter-spacing:0">${sub}</div>`:''}</div>`;
  const hot=Object.keys(HLG).map(k=>[k,leagueHeat(k)]).filter(x=>x[1]&&(x[1].hot||x[1].cold))
    .sort((x,y)=>Math.abs(y[1].d)-Math.abs(x[1].d))[0];
  return `<div class="streaks">
   ${box('Current run',a.run?`${a.run} ${word(a)}${a.run>1?'es':''}`.replace('losses','losses').replace('wines','wins'):'—',a.sign>0?'hot':a.sign<0?'cold':'')}
   ${box('Longest win streak',a.best||'—','', 'all picks')}
   ${box('\u2605 Best picks run',b.run?`${b.run} ${word(b)}${b.run>1?'es':''}`.replace('wines','wins'):'—',b.sign>0?'hot':b.sign<0?'cold':'','longest '+(b.best||0))}
   ${hot?box(hot[1].hot?'Hottest sport':'Coldest sport',(HLG[hot[0]]||hot[0])+' '+(hot[1].hot?'\u{1F525}':'\u{1F9CA}'),hot[1].hot?'hot':'cold',`${hot[1].w}-${hot[1].l} in 14 days, ${(hot[1].d>0?'+':'')+Math.round(hot[1].d*100)} pts vs season`):''}
  </div>`;
}


/* ---- the model's own line: what the spread would be if the model set it ----
   Shown next to the real line, never instead of it. Positive margin = home team favored. */
function modelMargin(g,p){
  if(!p) return null;
  if(Array.isArray(p.proj)&&p.proj.length===2&&p.proj[0]!=null&&p.proj[1]!=null){
    const a=parseFloat(p.proj[0]), h=parseFloat(p.proj[1]);
    if(!isNaN(a)&&!isNaN(h)) return h-a;
  }
  // college football publishes one margin, from the pick's point of view
  if(p.margin!=null&&!isNaN(p.margin)){ const sd=sideOf(p.pick,g); if(!sd) return null;
    return sd==='home'?Math.abs(+p.margin):-Math.abs(+p.margin); }
  return null;
}
function parseLine(txt,g){
  const t=String(txt||'').trim(); if(!t) return null;
  if(/^(pk|pick|even)$/i.test(t)) return 0;
  const m=t.match(/^(.*\S)\s+([+-]?\d+(?:\.\d+)?)$/); if(!m) return null;
  const n=parseFloat(m[2]); if(isNaN(n)) return null;
  const sd=sideOf(m[1],g); if(!sd) return null;
  return sd==='home'?-n:n;
}
function fmtSpread(M,away,home){
  const a=Math.abs(M);
  if(a<0.05) return 'PK';
  return esc(M>0?home:away)+' -'+a.toFixed(1);
}
function modelLine(g,p){
  const M=modelMargin(g,p); if(M==null) return null;
  const away=(p&&p.away)||g.away.abbr||g.away.short||'', home=(p&&p.home)||g.home.abbr||g.home.short||'';
  let mk=parseLine(p&&p.line,g); if(mk==null) mk=parseLine((g.odds||{}).details,g);
  return {M,market:mk,txt:fmtSpread(M,away,home),mtxt:mk==null?null:fmtSpread(mk,away,home),
          diff:mk==null?null:M-mk,away,home};
}
function lineDetail(g,p){
  const L=modelLine(g,p); if(!L) return '';
  let sent;
  if(L.market==null) sent='No market line to compare it with yet.';
  else if(Math.abs(L.diff)<0.05) sent='Dead on the market number.';
  else sent=`That is ${Math.abs(L.diff).toFixed(1)} point${Math.abs(L.diff)<0.95||Math.abs(L.diff)>=1.05?'s':''} more on <b>${esc(L.diff>0?L.home:L.away)}</b> than the market, which has <b>${L.mtxt}</b>.`+(L.M*L.market<0?' The two sides disagree on who should be favored.':'');
  return `<p class="muted" style="margin-top:4px">Model line: <b>${L.txt}</b>. ${sent} This is the model's own number, not a bet \u2014 against the real spread it has graded about 50%.</p>`;
}
function lineChip(g,p){
  const L=modelLine(g,p); if(!L) return '';
  let delta='', cls='';
  if(L.diff!=null){
    const d=Math.abs(L.diff);
    delta=d<0.05?'\u00b7 same as the market':`\u00b7 ${d.toFixed(1)} pt${d<0.95||d>=1.05?'s':''} toward ${esc(L.diff>0?L.home:L.away)}`;
    // highlight only a real disagreement: the model makes the other team the favorite
    if(L.M*L.market<0) cls='ml-big';
  }
  const tip=`If the model set the line it would be ${L.txt.replace(/<[^>]*>/g,'')}.`+(L.mtxt?` The market has ${L.mtxt.replace(/<[^>]*>/g,'')}.`:'');
  return `<span class="chip mline ${cls}" title="${esc(tip)}">Model line <b>${L.txt}</b>${delta?`<span class="mldelta">${delta}</span>`:''}</span>`;
}

/* ---- 3. sweat meter ---- */
function sweat(g,p){
  if(!p||g.state!=='in') return null;
  const sd=sideOf(p.pick,g); if(!sd) return null;
  const hs=parseFloat(g.home.score), as=parseFloat(g.away.score);
  const s=S.sum[g.id]; let wp=null, exact=false;
  if(s&&s.wp&&s.wp.length){ const h=s.wp[s.wp.length-1]; if(h!=null){ wp=sd==='home'?h:1-h; exact=true; } }
  let marg=null;
  if(!isNaN(hs)&&!isNaN(as)) marg=sd==='home'?hs-as:as-hs;
  if(wp==null){ if(marg==null) return null; wp=1/(1+Math.exp(-marg/7)); }
  // if ESPN's number is stale and flatly contradicts a big lead, trust the scoreboard
  if(exact&&marg!=null&&Math.abs(marg)>=12&&((marg>0&&wp<.5)||(marg<0&&wp>.5))){ wp=1/(1+Math.exp(-marg/7)); exact=false; }
  const t=wp>=.92?['Cruising','sw-ok']:wp>=.72?['Comfortable','sw-ok']:wp>=.45?['Sweating','sw-warn']:wp>=.18?['In trouble','sw-bad']:['Need a miracle','sw-bad'];
  return {wp,marg,lab:t[0],cls:t[1],side:sd,exact};
}
function sweatChip(g,p){
  const sw=sweat(g,p); if(!sw) return '';
  return `<span class="sweat ${sw.cls}" title="Live chance the model's pick holds up${sw.exact?'':' (estimated from the score)'}">${esc(sw.lab)} \u00b7 ${Math.round(sw.wp*100)}%</span>`;
}

/* ---- 4. upset alerts ---- */
function favOf(g){
  const o=g.odds||{}; const m=String(o.details||'').trim().match(/^(.*\S)\s+([+-]?\d+(?:\.\d+)?)$/);
  if(!m) return null; const n=parseFloat(m[2]); if(!(n<0)) return null;
  const sd=sideOf(m[1],g); return sd?{side:sd,size:Math.abs(n)}:null;
}
function isLate(g){
  const d=String(g.detail||'').toLowerCase();
  return /halftime|2nd half|3rd quarter|4th quarter|overtime|\bot\b|\b(7th|8th|9th|10th|11th|12th)\b/.test(d);
}
function buildAlerts(evs,lg){
  const out=[]; const nm=t=>esc(t.abbr||t.short||t.name||'');
  for(const g of evs){
    if(g.state!=='in') continue;
    const hs=parseFloat(g.home.score), as=parseFloat(g.away.score); if(isNaN(hs)||isNaN(as)) continue;
    const late=isLate(g), p=findPick(g,lg);
    if(p&&p.best){ const sw=sweat(g,p);
      if(sw&&sw.wp<.42&&(sw.marg==null||sw.marg<=2)&&(late||sw.wp<.30))
        out.push({sev:2+(1-sw.wp),cls:'al-bad',id:g.id,txt:`\u2605 ${esc(p.pick)} is in trouble \u2014 ${nm(g.away)} ${as}, ${nm(g.home)} ${hs} \u00b7 ${esc(g.detail)}`});
    }
    const f=favOf(g);
    if(f&&f.size>=5&&late){
      const dogT=f.side==='home'?g.away:g.home, favT=f.side==='home'?g.home:g.away;
      const ds=f.side==='home'?as:hs, fs=f.side==='home'?hs:as;
      if(ds>fs) out.push({sev:1+Math.min(f.size,20)/20,cls:'al-up',id:g.id,txt:`Upset alert \u2014 ${nm(dogT)} ${ds}, ${nm(favT)} ${fs} (${f.size}-point dog in front) \u00b7 ${esc(g.detail)}`});
    }
  }
  const seen=new Set();
  return out.sort((a,b)=>b.sev-a.sev).filter(x=>{ if(seen.has(x.id)) return false; seen.add(x.id); return true; }).slice(0,4);
}
function renderAlerts(){
  const el=$('alerts'); if(!el) return;
  const a=buildAlerts(S.events,S.league);
  el.innerHTML=a.map(x=>`<button class="alert ${x.cls}" type="button" data-jump="${x.id}">${x.txt}</button>`).join('');
}

/* ---- 5. last night's recap ---- */
function recapData(){
  const rows=heatRows(); if(!rows.length) return null;
  const today=ymd(new Date());
  const d=[...new Set(rows.map(r=>r.date))].filter(x=>x<today).sort().pop(); if(!d) return null;
  const rs=rows.filter(r=>r.date===d); if(!rs.length) return null;
  const w=rs.filter(r=>r.res==='W').length;
  const b=rs.filter(r=>r.best), bw=b.filter(r=>r.res==='W').length;
  const at=rs.filter(r=>r.ats==='W'||r.ats==='L'), aw=at.filter(r=>r.ats==='W').length;
  const key=r=>(r.vegas!=null&&!isNaN(r.vegas))?r.vegas:r.win;
  const wins=rs.filter(r=>r.res==='W'), losses=rs.filter(r=>r.res==='L');
  const best=wins.length?wins.reduce((x,y)=>key(x)<=key(y)?x:y):null;
  const worst=losses.length?losses.reduce((x,y)=>x.win>=y.win?x:y):null;
  const lgs=[...new Set(rs.map(r=>r.lg))].map(lg=>{const z=rs.filter(r=>r.lg===lg); return {lg,w:z.filter(r=>r.res==='W').length,n:z.length};});
  return {d,n:rs.length,w,l:rs.length-w,b:b.length,bw,ats:[aw,at.length-aw],best,worst,lgs};
}
function recapHTML(){
  const r=recapData(); if(!r) return '';

  const line=(lab,x)=>x?`<li><span class="rc-k">${lab}</span><b>${esc(x.pick)}</b> ${x.win}%${x.vegas!=null?` <span class="muted">(Vegas ${x.vegas}%)</span>`:''} <span class="muted">\u00b7 ${esc(x.away)} @ ${esc(x.home)}${x.final?' \u00b7 '+esc(x.final):''}</span></li>`:'';
  const day=new Date(r.d+'T12:00:00').toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'});
  return `<section class="recap"><div class="rc-head"><b>Last time out \u00b7 ${esc(day)}</b><button class="mvx" type="button" data-recap="${r.d}" aria-label="Hide this recap">\u2715</button></div>
  <div class="rc-row"><span class="rc-big">${r.w}\u2013${r.l}</span><span class="muted">straight up${r.b?` \u00b7 \u2605 ${r.bw}\u2013${r.b-r.bw}`:''}${(r.ats[0]+r.ats[1])?` \u00b7 ATS ${r.ats[0]}\u2013${r.ats[1]}`:''}</span></div>
  <ul class="rc-list">${line('Best call',r.best)}${line('Worst miss',r.worst)}</ul>

/* ---- 6. parlay slip (play money) ---- */
const SLIP_START=1000, HOLD=0.025;
S.slip=(()=>{const d={bank:SLIP_START,legs:[],open:[],done:[]};
  try{const o=JSON.parse(store.get('slip')||'null'); return (o&&typeof o==='object')?Object.assign(d,o):d;}catch(e){return d;}})();
S.slipEv={}; if(!S.stEv) S.stEv={}; if(!S.mvEv) S.mvEv={};
function slipSave(){ store.set('slip',JSON.stringify(S.slip)); }
function slipHas(lg,id,side){ return S.slip.legs.some(l=>l.lg===lg&&l.id===id&&(side==null||l.side===side)); }
function slipHasLeg(lg,id){ return slipHas(lg,id); }
function propLegId(P,lab,dir){ return 'p:'+P.id+':'+lab+':'+dir; }
/* a price the book is actually offering, typed in American form */
function americanDec(txt){
  const v=parseFloat(String(txt==null?'':txt).replace(/[^0-9+\-.]/g,''));
  if(isNaN(v)||v===0||Math.abs(v)<100) return null;
  return v>0?1+v/100:1+100/(-v);
}
const clampP=v=>Math.max(.02,Math.min(.97,v));   /* no 1-in-500 legs: books cut them off too */
function legDec(l){
  const book=americanDec(l.odds);
  if(book) return book;              // his book's real number, vig included
  const raw=(l.vegas!=null&&!isNaN(l.vegas))?l.vegas/100:(l.win!=null?l.win/100:null);
  if(raw==null||raw<=0) return null;
  return 1/Math.min(.96,clampP(raw)*(1+HOLD));
}
function legModelP(l){ return l.win!=null?clampP(l.win/100):null; }
function amer(dec){ if(dec==null) return '\u2014'; return dec>=2?'+'+Math.round((dec-1)*100):String(Math.round(-100/(dec-1))); }
/* either side of a game can go on the slip. The model prices its own pick, so the
   other side is that number flipped; a side the model says nothing about carries no
   price until you type your book's odds next to it. */
function slipSide(lg,g,side){
  const p=findPick(g,lg), m=myGet(lg,g.id);
  const t=side==='home'?g.home:g.away;
  const pick=t.abbr||t.name||side;
  let win=null,vegas=null,src='you';
  if(p){ const sd=sideOf(p.pick,g);
    if(sd===side){ win=p.win; vegas=p.vegas; }
    else if(sd){ win=p.win!=null?100-p.win:null; vegas=p.vegas!=null?100-p.vegas:null; }
    src=(m&&m.side===side)?'you':(sd===side?'model':'fade');
  }
  return {side,pick,win,vegas,src};
}
function slipPick(lg,g){   /* kept for the model's own side */
  const p=findPick(g,lg); const sd=p?sideOf(p.pick,g):null;
  return sd?slipSide(lg,g,sd):null;
}
function slipToggle(lg,g,side){
  if(slipHas(lg,g.id,side)){ S.slip.legs=S.slip.legs.filter(l=>!(l.lg===lg&&l.id===g.id&&l.side===side)); slipSave(); return; }
  const k=slipSide(lg,g,side); if(!k) return;
  if(S.slip.legs.length>=10) return;
  S.slip.legs.push({lg,id:g.id,d:ymd(g.date),away:g.away.abbr||'',home:g.home.abbr||'',pick:k.pick,side:k.side,win:k.win,vegas:k.vegas,src:k.src,odds:''});
  slipSave();
}
function slipBtn(lg,g){
  if(g.state!=='pre') return '';
  return ['away','home'].map(side=>{
    const k=slipSide(lg,g,side), on=slipHas(lg,g.id,side);
    const d=legDec({win:k.win,vegas:k.vegas});
    return `<button class="slipbtn${k.src==='model'?' mdl':''}" type="button" data-slip="${lg}|${g.id}|${side}" aria-pressed="${on}" title="${on?'Remove':'Add'} ${esc(k.pick)}${k.src==='model'?' (the model\u2019s side)':''}">${on?'\u2713 ':'+ '}${esc(k.pick)}${d?' <span class="so">'+amer(d)+'</span>':''}</button>`;
  }).join('');
}
function slipPlace(stake){
  const legs=S.slip.legs; if(!legs.length) return;
  const decs=legs.map(legDec); if(decs.some(d=>d==null)) return;
  const st=Math.max(1,Math.min(S.slip.bank,Math.round(+stake||0)));
  if(!(st>=1)) return;
  const copy=legs.map((l,i)=>Object.assign({},l,{dec:decs[i]}));
  S.slip.bank=Math.round((S.slip.bank-st)*100)/100;
  S.slip.open.push({t:Date.now(),stake:st,legs:copy});
  S.slip.legs=[]; slipSave();
}
function slipSettle(){
  let changed=false;
  for(const b of S.slip.open.slice()){
    let allDone=true, lost=false;
    for(const l of b.legs){
      if(!l.res&&l.kind==='prop'){ if(settlePropLeg(l)) changed=true; }
      if(!l.res&&l.kind!=='prop'){
        const g=S.slipEv[l.lg+'|'+l.id];
        if(g&&g.state==='post'){
          const hs=parseFloat(g.home.score), as=parseFloat(g.away.score);
          if(!isNaN(hs)&&!isNaN(as)){
            const mine=l.side==='home'?hs:as, opp=l.side==='home'?as:hs;
            l.res=mine>opp?'W':mine<opp?'L':'P';
            l.final=(g.away.abbr||'')+' '+as+'-'+(g.home.abbr||'')+' '+hs;
            changed=true;
          }
        }
      }
      if(!l.res) allDone=false; else if(l.res==='L') lost=true;
    }
    if(lost||allDone){
      const dec=b.legs.filter(l=>l.res&&l.res!=='P').reduce((a,l)=>a*(l.dec||1),1);
      b.won=!lost; b.settled=Date.now();
      b.payout=b.won?Math.round(b.stake*dec*100)/100:0;
      if(b.won) S.slip.bank=Math.round((S.slip.bank+b.payout)*100)/100;
      S.slip.done.unshift(b); if(S.slip.done.length>40) S.slip.done.length=40;
      S.slip.open=S.slip.open.filter(x=>x!==b);
      changed=true;
    }
  }
  if(changed) slipSave();
  return changed;
}
S.plog=S.plog||{};
function plogKey(l){ return l.lg+'|'+l.pid; }
/* pull each prop player's game log once: it settles the leg and lets two props on
   the same player be judged on how often they have actually landed together */
async function loadPropLogs(legs){
  const need=[...new Set(legs.filter(l=>l.kind==='prop'&&l.pid).map(plogKey))].filter(k=>!S.plog[k]);
  await Promise.all(need.map(async k=>{
    const [lg,pid]=k.split('|'); const L=LEAGUES[lg]; if(!L) return;
    const [sport,league]=L.path.split('/');
    try{ const d=await getJSON(WEBAPI+'common/v3/sports/'+sport+'/'+league+'/athletes/'+pid+'/gamelog',16000);
      const g=parseGameLog(d); if(g&&g.rows.length) S.plog[k]=g;
    }catch(e){}
  }));
}
function legStatVal(l,row,labels){
  const i=labels.indexOf(l.stat); if(i<0) return null;
  const v=parseFloat(String(row.stats[i]==null?'':row.stats[i]).replace(/,/g,''));
  return isNaN(v)?null:v;
}
function settlePropLeg(l){
  if(l.res||l.kind!=='prop') return false;
  const g=S.plog[plogKey(l)]; if(!g) return false;
  const row=g.rows.find(r=>String(r.id)===String(l.gid)); if(!row) return false;
  const v=legStatVal(l,row,g.labels); if(v==null) return false;
  l.actual=v;
  l.res=v===l.line?'P':((v>l.line)===(l.dir==='over')?'W':'L');
  l.final=l.stat+' '+v+(row.opp?' vs '+(row.opp.abbreviation||''):'');
  return true;
}
/* how often two props on the same player have landed in the SAME game */
function jointRate(a,b){
  if(a.kind!=='prop'||b.kind!=='prop'||a.pid!==b.pid) return null;
  const g=S.plog[plogKey(a)]; if(!g) return null;
  const hit=(l,row)=>{ const v=legStatVal(l,row,g.labels); if(v==null||v===l.line) return null;
    return (v>l.line)===(l.dir==='over'); };
  let n=0,both=0,pa=0,pb=0;
  for(const r of g.rows){ const x=hit(a,r), y=hit(b,r); if(x==null||y==null) continue;
    n++; if(x) pa++; if(y) pb++; if(x&&y) both++; }
  if(n<4) return null;
  const indep=(pa/n)*(pb/n);
  return {n,both,joint:both/n,indep,lift:indep>0?(both/n)/indep:null};
}
function gameKeyOf(l){ return l.kind==='prop'?(l.gid?l.lg+'|'+l.gid:null):l.lg+'|'+l.id; }
function slipConflicts(legs){
  const out=[];
  const add=(sev,t,d)=>out.push({sev,t,d});
  for(let i=0;i<legs.length;i++) for(let j=i+1;j<legs.length;j++){
    const a=legs[i],b=legs[j];
    if(a.kind==='prop'&&b.kind==='prop'&&a.pid===b.pid&&a.stat===b.stat){
      if(a.dir!==b.dir) add('hard','Both sides of the same prop',`${a.player} ${a.stat} over and under are both on. They cannot both land \u2014 this slip can never win.`);
      else add('hard','The same prop twice',`${a.player} ${a.stat} ${a.dir} ${a.line} is on here twice.`);
      continue;
    }
    if(a.kind!=='prop'&&b.kind!=='prop'&&a.lg===b.lg&&a.id===b.id){
      add('hard','Both sides of one game',`${a.pick} and ${b.pick} are the same game. One of them has to lose.`);
      continue;
    }
    if(a.kind==='prop'&&b.kind==='prop'&&a.pid===b.pid){
      const jr=jointRate(a,b);
      add('soft','Two props on the same player',
        `${a.player}: ${a.stat} and ${b.stat}. These move together, so multiplying their odds is wrong.`+
        (jr?` In his log both landed in <b>${jr.both} of ${jr.n}</b> games (${(jr.joint*100).toFixed(0)}%), against ${(jr.indep*100).toFixed(0)}% if they were independent \u2014 ${jr.lift>1.1?'better':jr.lift<0.9?'worse':'about the same as'} than the parlay math assumes.`:' Not enough shared games in his log to measure it.'));
      continue;
    }
    const ka=gameKeyOf(a), kb=gameKeyOf(b);
    if(ka&&kb&&ka===kb){
      // a prop and that game's side, or two props from one game
      const sideLeg=a.kind!=='prop'?a:(b.kind!=='prop'?b:null), pl=a.kind==='prop'?a:b;
      if(sideLeg&&pl.at&&pl.opp){
        const backingOpp=(sideLeg.pick||'').toUpperCase().includes(String(pl.opp).toUpperCase());
        if(backingOpp&&pl.dir==='over')
          add('soft','Pulling against yourself',`You have ${pl.player} over ${pl.line} ${pl.stat} and ${sideLeg.pick} in the same game. Players usually go over when their own side is doing well, so these two fight each other.`);
        else add('soft','Same game as another leg',`${pl.pick} and ${sideLeg.pick} are the same game, so they rise and fall together. The combined odds below assume they do not.`);
      } else {
        add('soft','Two legs from one game',`${a.pick} and ${b.pick} come from the same game. Books price these as a same-game parlay for a reason \u2014 the straight multiplication below overstates how long the price should be.`);
      }
    }
  }
  // many legs, one game
  const byGame={};
  legs.forEach(l=>{const k=gameKeyOf(l); if(k) byGame[k]=(byGame[k]||0)+1;});
  const worst=Object.entries(byGame).sort((a,b)=>b[1]-a[1])[0];
  if(worst&&worst[1]>=3) add('soft','Three or more legs in one game',`${worst[1]} of your ${legs.length} legs are the same game. Treat the combined number as a rough ceiling, not a price.`);
  const unpriced=legs.filter(l=>legDec(l)==null);
  if(unpriced.length)
    add('hard','A leg has no price',`${unpriced.map(l=>esc(l.pick)).join(', ')} \u2014 the model says nothing about ${unpriced.length>1?'these sides':'this side'} and no book odds are typed in, so there is nothing to pay out on. Put your book\u2019s number in the odds box next to ${unpriced.length>1?'them':'it'}.`);
  const modelOnly=legs.filter(l=>l.kind==='prop'&&!americanDec(l.odds)&&legDec(l)!=null);
  if(modelOnly.length)
    add('soft','Some props are priced off the model',`${modelOnly.length} prop${modelOnly.length>1?'s have':' has'} no book odds typed in, so ${modelOnly.length>1?'their':'its'} edge shows as zero. Put your book\u2019s price in to see whether there is anything there.`);
  const fades=legs.filter(l=>l.src==='fade');
  if(fades.length)
    add('soft','Against the model',`${fades.map(l=>esc(l.pick)).join(', ')} \u2014 the model likes the other side ${fades.length>1?'of those games':'of that game'}. Fine if that is the bet you want, but the price shown is the model\u2019s number flipped, not an independent read.`);
  const seen=new Set(), dedup=[];
  for(const c of out){ const k=c.sev+'|'+c.t+'|'+c.d; if(!seen.has(k)){ seen.add(k); dedup.push(c); } }
  return dedup.sort((a,b)=>(a.sev==='hard'?0:1)-(b.sev==='hard'?0:1));
}

async function loadSlip(){
  if(S.slipFlight) return; S.slipFlight=true;
  renderSlip();
  const need=[], props=[];
  for(const b of S.slip.open) for(const l of b.legs){ if(l.kind==='prop') props.push(l); else if(!l.res) need.push(l.lg+'|'+l.d); }
  for(const l of S.slip.legs){ if(l.kind==='prop') props.push(l); else need.push(l.lg+'|'+l.d); }
  await loadPropLogs(props);
  await Promise.all([...new Set(need)].map(async k=>{
    const [lg,d]=k.split('|'); const L=LEAGUES[lg]; if(!L) return;
    const q=new URLSearchParams(L.params||{}); q.set('dates',d.replace(/-/g,''));
    try{ const data=await getJSON(API+L.path+'/scoreboard?'+q,20000);
      for(const ev of (data.events||[]).map(norm)) S.slipEv[lg+'|'+ev.id]=ev; }catch(e){}
  }));
  slipSettle(); S.slipFlight=false; S.slipLast=Date.now();
  if(S.league==='slip') renderSlip();
}

  if(S.slipFocus!=null){ const n=document.querySelector(`[data-legodds="${S.slipFocus}"]`);

async function propFind(q){
  const my=++pSeq; const P=S.props; P.q=q; P.busy=true; P.find=null; P.err=null; P.id=null; P.ctx=null; renderProps();
  let found=[],err=null;
  try{
    const d=await getJSON(WEBAPI+'common/v3/search?limit=20&type=player&query='+encodeURIComponent(q),12000);
    const seen=new Set();
    (function walk(o){ if(!o||typeof o!=='object') return; if(Array.isArray(o)){o.forEach(walk);return;}
      const m=/l:(\d+)~a:(\d+)/.exec(o.uid||'');
      if(m&&o.displayName&&LG_BY_ID[m[1]]&&!seen.has(m[2])){ seen.add(m[2]);
        found.push({id:m[2],lg:LG_BY_ID[m[1]],name:o.displayName,sub:o.subtitle||o.description||'',img:(o.image&&(o.image.default||o.image.href))||(o.headshot&&o.headshot.href)||''}); }
      for(const k in o) if(o[k]&&typeof o[k]==='object') walk(o[k]); })(d);
  }catch(e){ err=e.name==='AbortError'?'timed out':e.message; }
  if(my!==pSeq||S.league!=='props') return;
  P.busy=false; P.find=found; P.err=err;
  if(found.length===1){ propOpen(found[0]); return; }
  renderProps();
}

/* next (or current) game for a team: today's scoreboard first, then the team schedule */
async function propNext(lg,teamId){
  if(!teamId) return null;
  const L=LEAGUES[lg]; const tid=String(teamId);
  const pick=(evId,evDate,cs,state,detail)=>{
    const me=cs.find(x=>String((x.team||x).id)===tid); if(!me) return null;
    const op=cs.find(x=>x!==me); if(!op) return null;
    const t=op.team||op;
    return {id:evId,t:Date.parse(evDate||'')||0,home:me.homeAway==='home',state,detail,
      opp:{id:String(t.id||''),abbr:t.abbreviation||'',name:t.shortDisplayName||t.displayName||t.name||t.location||''}};
  };
  try{
    const q=new URLSearchParams(Object.assign({},L.params||{})).toString();
    const d=await getJSON(API+L.path+'/scoreboard'+(q?'?'+q:''),15000);
    for(const e of (d.events||[])){
      const c=(e.competitions||[])[0]||{}; const st=((c.status||e.status||{}).type||{});
      if(st.completed) continue;
      const g=pick(e.id,e.date||c.date,c.competitors||[],st.state||'pre',(c.status||e.status||{}).displayClock?((c.status||e.status||{}).type||{}).shortDetail:(st.shortDetail||''));
      if(g) return g;
    }
  }catch(e){}
  try{
    const d=await getJSON(API+L.path+'/teams/'+tid+'/schedule',15000);
    const now=Date.now()-4*36e5; let best=null;
    for(const e of (d.events||[])){
      const c=(e.competitions||[])[0]||{}; const st=((c.status||e.status||{}).type||{});
      if(st.completed) continue;
      const g=pick(e.id,e.date||c.date,c.competitors||[],st.state||'pre',st.shortDetail||'');
      if(g&&g.t>=now&&(!best||g.t<best.t)) best=g;
    }
    return best;
  }catch(e){ return null; }
}

async function loadProps(){
  const P=S.props; if(!P.id){ renderProps(); return; }
  const key=P.lg+'|'+P.id;
  if(P.ctx&&P.ctxKey===key){ renderProps(); return; }
  const my=++pSeq; P.busy=true; P.err=null; P.ctx=null; renderProps();
  const L=LEAGUES[P.lg]; const [sport,league]=L.path.split('/');
  const base=WEBAPI+'common/v3/sports/'+sport+'/'+league+'/athletes/'+P.id;
  if(!S.nflRanks||!S.cbbRanks){ try{ await loadData(); }catch(e){} }
  const [info,glr,dfr]=await Promise.allSettled([getJSON(base,12000),getJSON(base+'/gamelog',16000),defense(P.lg)]);
  if(my!==pSeq||S.league!=='props') return;
  const a=(info.status==='fulfilled'&&(info.value.athlete||info.value))||{};
  const gl=glr.status==='fulfilled'?parseGameLog(glr.value):null;
  const def=dfr.status==='fulfilled'?dfr.value:null;
  const teamId=val(a,'team','id');
  const next=await propNext(P.lg,teamId);
  if(my!==pSeq||S.league!=='props') return;
  const roster=next&&next.opp&&next.opp.id?await propRoster(P.lg,next.opp.id):null;
  if(my!==pSeq||S.league!=='props') return;
  P.busy=false; P.ctxKey=key;
  if(!gl||!gl.rows.length||!gl.labels.length){ P.err=glr.status==='rejected'?('ESPN game log wouldn’t load ('+esc(glr.reason&&glr.reason.message||'error')+').'):'ESPN has no game log for this player yet.'; renderProps(); return; }
  const opp=r=>def&&r.opp&&def.teams[r.opp.id];
  const w=r=>{const t=opp(r); return t?def.avg/t.pa:1;};
  P.ctx={a,gl,def,opp,w,labels:gl.labels,rows:gl.rows,teamId:teamId?String(teamId):'',next,roster,
    team:val(a,'team','displayName')||'',pos:val(a,'position','displayName')||val(a,'position','abbreviation')||'',
    head:val(a,'headshot','href')||P.img||'',inj:(a.injuries||[])[0]||null};
  const num=gl.labels.map((l,i)=>({l,i})).filter(c=>gl.rows.filter(r=>/^-?\d+(\.\d+)?$/.test(String(r.stats[c.i]==null?'':r.stats[c.i]).replace(/,/g,''))).length>=Math.ceil(gl.rows.length*0.6));
  P.ctx.num=num;
  P.top=propTop(P.lg,P.ctx.pos,num);
  if(P.stat==null||!num.some(c=>c.i===P.stat)) P.stat=(['PTS','YDS','REC','H','K','REB','AST'].map(x=>num.find(c=>c.l===x)).find(Boolean)||num[0]||{i:null}).i;
  if(P.top.length&&!P.top.some(c=>c.i===P.stat)) P.stat=P.top[0].i;
  renderProps();
}

function propVals(i){
  const c=S.props.ctx; if(!c||i==null) return [];
  return c.rows.map(r=>({r,v:parseFloat(String(r.stats[i]==null?'':r.stats[i]).replace(/,/g,''))})).filter(x=>!isNaN(x.v));
}
function propHit(xs,line){
  const n=xs.length; if(!n) return {n:0,o:0,pct:null,avg:null};
  const avg=xs.reduce((s,x)=>s+x.v,0)/n;
  if(isNaN(line)) return {n,o:0,pct:null,avg};
  const o=xs.filter(x=>x.v>line).length, u=xs.filter(x=>x.v<line).length;
  return {n,o,u,p:n-o-u,pct:o/n,avg};
}
/* chance this player goes over (or under) a line.
   Two readings: how often he has actually done it, and a normal curve around his
   opponent-weighted average using his own game-to-game spread. Blended, because a
   10-game hit rate alone is jumpy and a normal curve alone ignores his real shape. */
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  let pr=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-pr:pr; }
function propProb(vals,line,dir,wfn){
  const n=vals.length; if(!n||isNaN(line)) return null;
  const over=vals.filter(x=>x.v>line).length, push=vals.filter(x=>x.v===line).length;
  const dec=n-over-push;
  const hit=(n-push)>0?over/(n-push):null;          // observed, pushes removed
  const sw=wfn?vals.reduce((s,x)=>s+wfn(x.r),0):n;
  const mu=wfn?vals.reduce((s,x)=>s+wfn(x.r)*x.v,0)/sw:vals.reduce((s,x)=>s+x.v,0)/n;
  const m0=vals.reduce((s,x)=>s+x.v,0)/n;
  const sd=Math.sqrt(vals.reduce((s,x)=>s+(x.v-m0)*(x.v-m0),0)/Math.max(1,n-1))||1;
  const curve=1-normCdf((line-mu)/sd);
  // the hit rate earns its weight as the sample grows; at 10 games it is about half
  const w=Math.min(0.6,n/20);
  let p=hit!=null?(w*hit+(1-w)*curve):curve;
  if(dir==='under') p=1-p;
  return {p:clampP(p),n,over,push,hit:hit==null?null:(dir==='under'?1-hit:hit),curve:dir==='under'?1-curve:curve,mu,sd};
}
function propTile(k,big,sub,cls,title){
  return `<div class="tile"${title?` title="${esc(title)}"`:''}><div class="k">${esc(k)}</div><div class="v ${cls||''}" style="font-size:21px">${big}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
}

/* the three stats that matter for this player's sport and position */
function propTop(lg,pos,num){
  const p=String(pos||'').toUpperCase(); let want;
  if(lg==='nba'||lg==='cbb') want=['PTS','REB','AST'];
  else if(lg==='mlb') want=/PITCH|^P$|^SP$|^RP$/.test(p)?['IP','K','ER']:['H','RBI','HR'];
  else if(/QUARTERBACK|^QB$/.test(p)) want=['YDS','TD','CMP'];
  else if(/RUNNING ?BACK|FULLBACK|^RB$|^FB$/.test(p)) want=['YDS','CAR','TD'];
  else if(/RECEIVER|TIGHT ?END|^WR$|^TE$/.test(p)) want=['REC','YDS','TD'];
  else if(/KICKER|PUNTER|^PK$|^K$|^P$/.test(p)) want=['FG','PTS','XP'];
  else if(/BACK|LINEBACKER|SAFETY|CORNER|END|TACKLE|^LB$|^CB$|^S$|^DE$|^DT$/.test(p)) want=['TOT','SOLO','SACK'];
  else want=['YDS','TD','REC'];
  const out=[];
  for(const l of want){ const c=num.find(x=>x.l===l); if(c&&!out.includes(c)) out.push(c); }
  for(const c of num){ if(out.length>=3) break; if(!out.includes(c)) out.push(c); }
  return out.slice(0,3);
}
function propLineOf(i){ const v=S.props.lines&&S.props.lines[i]; return v==null?'':v; }
function propMini(col,active){
  const ln=parseFloat(propLineOf(col.i));
  const vals=propVals(col.i);
  const h=propHit(vals,ln), l5=propHit(vals.slice(0,5),ln);
  const last=vals.slice(0,10).reverse();
  const mx=Math.max(...last.map(x=>x.v),isNaN(ln)?0:ln,1);
  const bars=last.map(x=>`<i class="${isNaN(ln)?'':x.v>ln?'over':x.v<ln?'under':'push'}" style="height:${Math.max(10,x.v/mx*100).toFixed(0)}%" title="${esc(x.v)}"></i>`).join('');
  const big=!h.n?'\u2014':(h.pct==null?h.avg.toFixed(1):pctTxt(h.pct));
  const cls=h.pct==null?'':h.pct>=.6?'good':h.pct<=.4?'bad':'';
  const sub=!h.n?'no games':(h.pct==null?`avg \u00b7 L5 ${l5.avg!=null?l5.avg.toFixed(1):'\u2014'}`:`${h.o} of ${h.n} \u00b7 avg ${h.avg.toFixed(1)}`);
  const c=S.props.ctx;
  const og=c&&c.next&&c.next.opp&&c.def?c.def.teams[c.next.opp.id]:null;
  const G=og?gradeFor(og,col.l):null, ogr=G&&G.g;
  let matchup='';
  if(G){
    const band=vals.filter(x=>{const q=gradeFor(c.opp(x.r),col.l); return q&&q.g===ogr;});
    const bh=propHit(band,ln);
    const gc='AB'.includes(ogr)?'bad':'DF'.includes(ogr)?'good':'';
    const tail=!bh.n?`no grade-${ogr} games yet`:(bh.pct==null?`${bh.avg.toFixed(1)} avg in ${bh.n}`:`${bh.o} of ${bh.n} over`);
    matchup=`<div class="mu" title="${esc((c.next.opp.name||c.next.opp.abbr)+': #'+G.rank+' of '+G.n+' by '+G.src+(G.detail?' ('+G.detail+')':'')+'. A = toughest 20%, F = easiest 20%. His '+col.l+' vs grade-'+ogr+' defenses: '+tail+'.')}"><span>${c.next.home?'vs':'@'} ${esc(c.next.opp.abbr||c.next.opp.name)} <b class="${gc}">${ogr}</b> <span class="muted">#${G.rank}</span></span><span class="muted">${esc(tail)}</span></div>`;
  }
  return `<div class="pmc${active?' on':''}"><button class="pmbtn" type="button" data-ppstat="${col.i}" style="all:unset;cursor:pointer;display:grid;gap:4px"><span class="nm">${esc(col.l)}</span><span class="big ${cls}">${big}</span><span class="sm">${esc(sub)}</span></button><div class="spark">${bars}</div>${matchup}<input type="text" inputmode="decimal" autocomplete="off" placeholder="line" value="${esc(propLineOf(col.i))}" data-ppml="${col.i}" aria-label="${esc(col.l)} line"></div>`;
}

/* the grade to show for a given stat: the per-category split when the model has one */
function gradeFor(t,label){
  const P=S.props, c=P.ctx; if(!t||!c) return null;
  return statGrade(P.lg,t,c.pos,label)||dGradeT(t,c.def);
}

function propSlipToggle(){
  const P=S.props, c=P.ctx; if(!c||!c.next) return;
  const i=P.stat, lab=(c.num.find(x=>x.i===i)||{l:''}).l;
  const line=parseFloat(propLineOf(i)); if(isNaN(line)) return;
  const dir=P.dir||'over', id=propLegId(P,lab,dir);
  if(slipHas(P.lg,id)){ S.slip.legs=S.slip.legs.filter(l=>!(l.lg===P.lg&&l.id===id)); slipSave(); return; }
  if(S.slip.legs.length>=10) return;
  const pr=propProb(propVals(i),line,dir,c.w); if(!pr) return;
  S.slip.legs.push({kind:'prop',lg:P.lg,id,pid:String(P.id),gid:String(c.next.id||''),
    d:c.next.t?ymd(new Date(c.next.t)):'',

    opp:c.next.opp.abbr||'',at:c.next.home?'vs':'@',
    win:Math.round(pr.p*1000)/10,n:pr.n,hits:pr.over,odds:P.odds||'',src:'you'});
  slipSave();
}

    else if(P.find&&P.find.length) body+=`<h3>Players</h3><div class="plist">${P.find.map(f=>`<button class="pbtn" type="button" data-pp="${f.lg}|${f.id}|${esc(f.name)}|${esc(f.img)}">${f.img?`<img src="${esc(f.img)}" alt="" loading="lazy">`:'<span class="ph"></span>'}<span><b>${esc(f.name)}</b><span>${esc(f.sub)}</span></span><em>${esc(HLG[f.lg]||'')}</em></button>`).join('')}</div>`;

    else body+=`<p class="muted">Search any NFL, college football, NBA, college basketball or MLB player to pull his game-by-game log, hit rates against a line, and how the next opponent’s defense grades out.</p>`;
    if(rec.length) body+=`<h4 style="margin:10px 0 6px">Recent</h4><div class="plist">${rec.map(f=>`<button class="pbtn" type="button" data-pp="${f.lg}|${f.id}|${esc(f.name)}|${esc(f.img)}">${f.img?`<img src="${esc(f.img)}" alt="" loading="lazy">`:'<span class="ph"></span>'}<span><b>${esc(f.name)}</b><span class="muted">tap to reopen</span></span><em>${esc(HLG[f.lg]||'')}</em></button>`).join('')}</div>`;

  }

  const c=P.ctx;
  if(!c){ box.innerHTML=`<div class="panel"><p style="margin:0 0 10px">${esc(P.err||'Couldn’t load this player.')}</p><p style="margin:0"><button class="linkbtn" type="button" data-ppback="1">← Another player</button></p></div>`; return; }
  const L=LEAGUES[P.lg];
  const line=parseFloat(propLineOf(P.stat));
  const i=P.stat, lab=(c.num.find(x=>x.i===i)||{l:''}).l;

  let out=`<div class="phead">${c.head?`<img src="${esc(c.head)}" alt="">`:''}<div><h3 style="margin:0">${esc(c.a.displayName||P.name)}</h3>
    <p class="sub" style="margin:2px 0 0">${esc([c.pos,c.team,HLG[P.lg]].filter(Boolean).join(' · '))}${injTxt?` · <span class="st-out">${esc(injTxt)}</span>`:''}</p></div></div>`;
  if(c.next){
    const when=c.next.state==='in'?'LIVE now':(c.next.t?new Date(c.next.t).toLocaleString([], {weekday:'short',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}):'next game');
    out+=`<p class="sub" style="margin:0">Next: <b>${c.next.home?'vs':'@'} ${esc(c.next.opp.name||c.next.opp.abbr)}</b> · ${esc(when)}${G?` · their defense grades <b class="${'AB'.includes(ogr)?'bad':'DF'.includes(ogr)?'good':''}">${ogr}</b>, <b>#${G.rank} of ${G.n}</b> <span class="muted">(${esc(G.src)}${G.detail?' · '+esc(G.detail):''})</span>`:''}</p>`;
  }

      :`<p class="sub" style="margin:0">No injury designations on ESPN’s roster for ${esc(c.next.opp.name||c.next.opp.abbr)} (${c.roster.length} players). ESPN doesn’t publish projected starters, so there’s no lineup card to show.</p>`;
  }

  out+=`<details style="margin-top:14px"><summary class="muted">What this tab can’t show</summary><p class="sub" style="margin:6px 0 0">Everything here is built off ESPN’s public feeds: game logs, standings, rosters and injuries. ESPN doesn’t publish historical prop lines, pitch-by-pitch data, shot or target coordinates, play-type tagging, or a target-share feed, so closing-line history, pitch mix, shooting and target zones, play-type splits and similar-player comps aren’t in here. Everything above is a real number from a real game, not a model guess.</p></details>`;

  box.innerHTML=`<div class="panel">${out}</div>`;
