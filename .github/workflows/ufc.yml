name: UFC Model Publish

on:
  schedule:
    # GitHub cron is UTC-only. Daily morning run (~8:20am CT standard time),
    # then every 2 hours through fight night Saturday into early Sunday UTC so
    # the closing line gets captured and results get graded.
    - cron: '20 14 * * *'
    - cron: '50 */2 * * 6'
    - cron: '50 0-8/2 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ufc-model
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run UFC model (ESPN data, stdlib only)
        run: python3 -I scripts/ufc_model.py data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ufc.json data/ufc_history.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update UFC model picks [skip ci]"
          # other publish jobs push to this branch too: rebase and retry
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
